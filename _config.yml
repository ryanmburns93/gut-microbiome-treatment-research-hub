# Site settings. GitHub Pages builds this with Jekyll automatically on every
# push to the publishing branch; there is nothing to build by hand.
title: Gut Brain Biome - Patient Resources, Emerging Treatments & Research Hub
short_title: Gut Brain Biome
description: >-
  Gut microbiome treatment research, one family's journey with it, and a
  community working toward better answers: what the evidence shows, what
  we've lived, and where discovery is heading.
author: Rainbow Data Labs
lang: en

# Served at the custom domain (see CNAME and docs/DEPLOYMENT.md). If the
# domain is ever removed, set url to "https://ryanmburns93.github.io" and
# baseurl to "/gut-microbiome-treatment-research-hub".
url: "https://gutbrainbiome.com"
baseurl: ""

# Contact form endpoint (Google Apps Script web app). Leave empty to show a
# "not configured yet" message. See google-apps-script/SETUP.md.
contact_endpoint: "https://script.google.com/macros/s/AKfycbwInOH4miUDO7VgeK8jsr7hgmiXykSZJMrQHFpx-2BePMs6VW6WyHZjhtV2mIRUpBbq/exec"

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Every Markdown file in _knowledge/ becomes a page at /knowledge/<file-name>/
collections:
  knowledge:
    output: true
    permalink: /knowledge/:name/
  # Every Markdown file in _journey/ becomes a dated update on Our Story,
  # at /story/<file-name>/
  journey:
    output: true
    permalink: /story/:name/

defaults:
  - scope:
      path: ""
      type: knowledge
    values:
      layout: entry
  - scope:
      path: ""
      type: journey
    values:
      layout: journey-entry
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - files/story/README.md
  - docs/
  - google-apps-script/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
