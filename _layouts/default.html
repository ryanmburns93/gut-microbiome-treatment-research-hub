<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	{% seo %}
	<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" />
	<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
<body>
	<a class="skip-link" href="#main">Skip to main content</a>
	{% include header.html %}
	<main id="main">
		{{ content }}
	</main>
	{% include footer.html %}
	<script src="{{ '/assets/js/nav.js' | relative_url }}"></script>
	{% for script in page.scripts %}
	<script src="{{ script | relative_url }}"></script>
	{% endfor %}
</body>
</html>
