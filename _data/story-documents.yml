# files/story/ and reference them as /files/story/<name>.pdf.
#
# EVERYTHING HERE IS PUBLIC. Before adding a file, redact: full names,
# dates of birth, medical record and insurance numbers, addresses, phone
# numbers, and anything your partner hasn't agreed to share.
#
#   title:    what the document is
#   date:     YYYY-MM or YYYY-MM-DD (free text is fine, e.g. "Spring 2024")
