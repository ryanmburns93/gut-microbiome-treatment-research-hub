# Key gut bacteria before FMT (Thorne, January 2026) and after the April
# round (Jona, April 28, 2026). The two labs measure differently, so we
# compare each one's own reference: Thorne's percentile versus other adults
# (below 20th = below typical, above 80th = above typical) and Jona's
# normal range. Generated from the raw exports; edit by hand if needed.
#   role: helpful | watch      topic: Evidence Map topic id (optional)
